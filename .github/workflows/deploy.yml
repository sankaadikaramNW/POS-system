name: CI/CD Build and Deploy to Google Cloud

on:
  push:
    branches:
      - main
      - master

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ secrets.GCP_REGION }} # e.g. us-central1
  REPOSITORY: ${{ secrets.GCP_ARTIFACT_REPOSITORY }} # e.g. pos-system-repo
  IMAGE_NAME: pos-app
  SERVICE_NAME: pos-service
  REGION: ${{ secrets.GCP_REGION }} # e.g. us-central1

jobs:
  deploy:
    name: Deploy to Google Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Required for Workload Identity Federation

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # GCP Authentication
      # ----------------------------------------------------
      # This step authenticates with Google Cloud.
      # You can use Workload Identity Federation (WIF) or fallback to a Service Account JSON Key.
      # WIF is highly recommended as it avoids long-lived secret keys.
      - name: Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          # FOR WORKLOAD IDENTITY FEDERATION (Recommended):
          # workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider'
          # service_account: 'my-service-account@my-project.iam.gserviceaccount.com'
          
          # FOR SERVICE ACCOUNT KEY (Alternative - simpler to start):
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # ----------------------------------------------------
      # Set up gcloud CLI
      # ----------------------------------------------------
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # ----------------------------------------------------
      # Authenticate Docker with Google Artifact Registry
      # ----------------------------------------------------
      - name: Configure Docker Credentials
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      # ----------------------------------------------------
      # Build and Push Docker Image
      # ----------------------------------------------------
      - name: Build and Tag Docker Image
        run: |
          IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}"
          docker build \
            --tag "$IMAGE_URI:${{ github.sha }}" \
            --tag "$IMAGE_URI:latest" \
            .

      - name: Push Docker Image to Artifact Registry
        run: |
          IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}"
          docker push "$IMAGE_URI:${{ github.sha }}"
          docker push "$IMAGE_URI:latest"

      # ----------------------------------------------------
      # Deploy to Google Cloud Run
      # ----------------------------------------------------
      - name: Deploy Container to Google Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
          
          # Pass database credentials and configuration via environment variables to Cloud Run
          env_vars: |
            DB_HOST=${{ secrets.DB_HOST }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASS=${{ secrets.DB_PASS }}
            DB_PORT=${{ secrets.DB_PORT || '3306' }}
            DB_SOCKET=/cloudsql/${{ secrets.GCP_CLOUD_SQL_CONNECTION_NAME }}

          # If using Google Cloud SQL (MySQL), this automatically configures the Cloud Run instance
          # to securely mount the database Unix Socket inside the container at `/cloudsql/<connection-name>`
          flags: |
            --add-cloudsql-instances=${{ secrets.GCP_CLOUD_SQL_CONNECTION_NAME }}
            --allow-unauthenticated

      # ----------------------------------------------------
      # Output Deployment URL
      # ----------------------------------------------------
      - name: Show Deployment Details
        run: |
          echo "Deployment successful!"
          echo "Service URL: ${{ steps.deploy.outputs.url }}"
